server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location /Cargo_Auctions/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /Cargo_Auctions/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
